# Configuration for the "vale" prose linter, run via "make vale".
#
# Vale is OPTIONAL and currently under evaluation: it is not part of "make build", it does not
# gate anything, and its findings are suggestions rather than errors. The point of this config
# is to see whether prose-style linting produces enough signal to be worth adopting.
#
# The house style under styles/PhotoPrism/ ships with the repository, so running "make vale"
# downloads nothing. To try an off-the-shelf package such as Google or Microsoft instead, add it
# to "Packages" below and run "vale sync" — note that this fetches the package over the network.
#
# See https://vale.sh/docs/ for the full configuration reference.

StylesPath = styles

# Report everything, including suggestions, while we are still judging the signal-to-noise ratio.
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = PhotoPrism

# Catches accidentally repeated words ("the the").
Vale.Repetition = YES

# Spelling is handled by "make spellcheck" (typos), which has a far lower false-positive rate
# than a dictionary-based check on technical prose.
Vale.Spelling = NO
